name: fix-filter-preview

on:
  push:
    branches:
      - preview/master-acoes-barbearia

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir filtro minimizável
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('app/master/page.tsx')
          text = page.read_text()
          old = '[filtersOpen,setFiltersOpen]=useState(true)'
          new = '[filtersOpen,setFiltersOpen]=useState(false)'
          if old not in text:
              raise SystemExit('estado esperado não encontrado')
          page.write_text(text.replace(old, new, 1))

          css = Path('app/master/master.css')
          text = css.read_text()
          old1 = '.master-shell .barbearias-filters:has(.filter-toggle.active) .filter-controls { display:none; }'
          old2 = '.master-shell .barbearias-filters:has(.filter-toggle:not(.active)) .filter-controls { display:grid; }'
          new1 = '.master-shell .barbearias-filters:has(.filter-toggle.active) .filter-controls { display:grid; }'
          new2 = '.master-shell .barbearias-filters:has(.filter-toggle:not(.active)) .filter-controls { display:none; }'
          if old1 not in text or old2 not in text:
              raise SystemExit('regras CSS esperadas não encontradas')
          css.write_text(text.replace(old1, new1, 1).replace(old2, new2, 1))
          PY
      - name: Commitar correção e remover workflow temporário
        run: |
          rm -f .github/workflows/fix-filter-preview.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/master/page.tsx app/master/master.css .github/workflows/fix-filter-preview.yml
          git commit -m 'fix: corrigir abertura do filtro compacto'
          git push
